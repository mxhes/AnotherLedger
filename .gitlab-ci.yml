# GitLab CI: runs the plain-Lua tests on every push and builds the release zip
# with the BigWigs packager.
#
# - test:    Lua 5.1 (the client's language version) and Lua 5.4 (catches code
#            that only one of them accepts).
# - lint:    luacheck over AnotherLedger/ (.luacheckrc): leaked or misspelled
#            globals, unused variables, overwritten values.
# - package: on a tag, builds the zip (and uploads it to CurseForge when the
#            CI variable CF_API_KEY is set and the .toc has X-Curse-Project-ID;
#            the variable is protected, so only protected v* tags get it).
# - package-dry-run: manual on any branch; builds the zip without uploading
#            and lists its files, to check the .pkgmeta layout (one AnotherLedger/
#            folder with the .toc inside). The zip is in the job's artifacts.
#
# The packager runs from the repo root (it refuses a top directory that is not
# a git checkout); .pkgmeta there turns AnotherLedger/ into the addon folder.

stages:
  - test
  - package

test:
  stage: test
  image: alpine:3.20
  parallel:
    matrix:
      - LUA: ["lua5.1", "lua5.4"]
  before_script:
    - apk add --no-cache "$LUA"
  script:
    - '"$LUA" tests/run.lua'

lint:
  stage: test
  image: alpine:3.20
  before_script:
    - apk add --no-cache lua5.1 lua5.1-dev luarocks5.1 build-base >/dev/null
    - luarocks-5.1 install luacheck >/dev/null
  script:
    - luacheck AnotherLedger

.packager:
  stage: package
  image: debian:bookworm-slim
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends bash ca-certificates curl git jq zip unzip subversion >/dev/null
    # The packager needs the full history and tags for the version and changelog.
    - git fetch --tags --unshallow || git fetch --tags
    - curl -fsSL -o /tmp/release.sh https://raw.githubusercontent.com/BigWigsMods/packager/v2/release.sh
  artifacts:
    paths:
      - .release/*.zip
    expire_in: 30 days

package:
  extends: .packager
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - bash /tmp/release.sh

package-dry-run:
  extends: .packager
  rules:
    - if: $CI_COMMIT_BRANCH
      when: manual
      allow_failure: true
  script:
    - bash /tmp/release.sh -d
    - unzip -l .release/*.zip
