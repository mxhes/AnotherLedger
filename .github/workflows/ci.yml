# GitHub Actions: the plain-Lua tests and luacheck on every push to main and
# every pull request, and the release zip with the BigWigs packager.
#
# - test:    Lua 5.1 (the client's language version) and Lua 5.4 (catches code
#            that only one of them accepts).
# - lint:    luacheck over AnotherLedger/ (.luacheckrc): leaked or misspelled
#            globals, unused variables, overwritten values.
# - package: on a v* tag, builds the zip and uploads it to CurseForge when the
#            repository secret CF_API_KEY is set and the .toc has
#            X-Curse-Project-ID. The zip is kept as the run's artifact.
# - package-dry-run: when the workflow is run by hand (Actions > CI > Run
#            workflow); builds the zip without uploading and lists its files,
#            to check the .pkgmeta layout (one AnotherLedger/ folder with the .toc
#            inside). The zip is the run's artifact.
#
# The packager runs from the repo root (it needs the git checkout there);
# .pkgmeta turns AnotherLedger/ into the addon folder.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        lua: ["5.1", "5.4"]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lua${{ matrix.lua }}
      - run: lua${{ matrix.lua }} tests/run.lua

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lua-check
      - run: luacheck AnotherLedger

  package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, lint]
    runs-on: ubuntu-24.04
    steps:
      # The packager needs the full history and tags for the version and changelog.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: AnotherLedger-release
          path: .release/*.zip
          retention-days: 30

  package-dry-run:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: BigWigsMods/packager@v2
        with:
          args: -d
      - run: unzip -l .release/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AnotherLedger-dry-run
          path: .release/*.zip
          retention-days: 30
